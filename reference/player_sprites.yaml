zone: player_sprites
lifespan: 0
startRoom: entrance

rooms:
  entrance:
    title: "Sprite Gallery"
    description: "A vast ethereal gallery where the forms of every adventurer in Ambon shimmer into view, each figure a crystallized echo of possibility."
    exits:
      n: base_hall
  base_hall:
    title: "Hall of Origins"
    description: "Twelve alcoves line this corridor, each radiating the essence of a different race. Simple wrapped figures stand within, awaiting their destiny."
    exits:
      s: entrance
      n: awakened_hall
  awakened_hall:
    title: "Awakened Hall"
    description: "The figures here have found their calling. Basic weapons gleam and simple armor catches the ambient light."
    exits:
      s: base_hall
      n: ascended_hall
  ascended_hall:
    title: "Ascended Hall"
    description: "Power radiates from these figures. Enchanted gear shimmers with subtle magical effects, class mastery evident in every detail."
    exits:
      s: awakened_hall
      n: legendary_hall
  legendary_hall:
    title: "Legendary Hall"
    description: "These figures blaze with power. Legendary weapons glow, dramatic auras swirl, and the air hums with barely contained magical force."
    exits:
      s: ascended_hall
      n: staff_hall
  staff_hall:
    title: "Staff Hall"
    description: "An ethereal sanctuary bathed in prismatic light. The figures here transcend mortal power — administrators and architects of the world itself."
    exits:
      s: legendary_hall

